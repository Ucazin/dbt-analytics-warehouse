name: 'analytics_warehouse'
version: '1.0.0'
config-version: 2

profile: 'analytics_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      core:
        +schema: core
      finance:
        +schema: finance

seeds:
  analytics_warehouse:
    +schema: seeds
    country_regions:
      +column_types:
        country_code: varchar(2)
    pricing_plans:
      +column_types:
        plan_id: varchar(20)
    product_categories:
      +column_types:
        category_id: varchar(20)

snapshots:
  +target_schema: snapshots
